<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>augur — Read the signs</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --aug-orange: #FF6E29;
  --aug-navy:   #16215B;
}

html, body {
  width: 100%; height: 100%;
  background: #06080f;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

#star-canvas {
  position: fixed; inset: 0;
  pointer-events: none; z-index: 0;
}

.nebula {
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 70% 50% at 52% 52%, rgba(31,41,156,0.10) 0%, transparent 70%),
    radial-gradient(ellipse 30% 55% at 12% 65%, rgba(147,51,234,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 25% 35% at 82% 28%, rgba(255,110,41,0.05) 0%, transparent 50%);
  pointer-events: none; z-index: 1;
}

/* Vignette */
.vignette {
  position: fixed; inset: 0;
  background: radial-gradient(ellipse 85% 85% at 50% 50%, transparent 40%, rgba(0,0,0,0.72) 100%);
  pointer-events: none; z-index: 2;
}

/* Full-screen prism stage */
.stage {
  position: relative; z-index: 3;
  width: 100%; height: 100vh;
  display: flex; align-items: center; justify-content: center;
  animation: stageIn 1s ease both;
}

@keyframes stageIn { from { opacity:0; } to { opacity:1; } }

.prism-svg {
  width: 100%; height: 100%;
  position: absolute; inset: 0;
  overflow: visible;
}

/* Signature stamp — bottom left */
.signature {
  position: fixed;
  bottom: 32px; left: 40px;
  z-index: 10;
  display: flex; flex-direction: column; gap: 5px;
  animation: sigIn 0.8s ease 4.2s both;
}

@keyframes sigIn {
  from { opacity:0; transform: translateY(6px); }
  to   { opacity:1; transform: translateY(0); }
}

.sig-wordmark { width: 180px; height: auto; }

.sig-sub {
  font-size: 8px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.22);
  padding-left: 2px;
}

/* Stats — bottom right whisper */
.stats {
  position: fixed;
  bottom: 32px; right: 40px;
  z-index: 10;
  display: flex; gap: 10px;
  font-size: 8px; letter-spacing: 0.14em; text-transform: uppercase;
  color: rgba(255,255,255,0.13);
  animation: sigIn 0.8s ease 4.5s both;
}

/* ── Animations ─────────────────────────────────── */
@keyframes beamReveal {
  from { stroke-dashoffset: 520; opacity: 0; }
  to   { stroke-dashoffset: 0;   opacity: 1; }
}
@keyframes prismIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes specReveal {
  from { stroke-dashoffset: 900; opacity: 0; }
  to   { stroke-dashoffset: 0;   opacity: 0.85; }
}
@keyframes specGlowReveal {
  from { stroke-dashoffset: 900; opacity: 0; }
  to   { stroke-dashoffset: 0;   opacity: 0.20; }
}
@keyframes labelIn {
  from { opacity: 0; transform: translateX(10px); }
  to   { opacity: 1; transform: translateX(0); }
}

.beam-glow { stroke-dasharray: 520; animation: beamReveal 1.6s ease 0.4s both; }
.beam-core { stroke-dasharray: 520; animation: beamReveal 1.6s ease 0.4s both; }

.prism-fill { animation: prismIn 0.8s ease 1.9s both; }
.prism-edge { animation: prismIn 0.8s ease 1.9s both; }
.prism-glow { animation: prismIn 0.8s ease 1.9s both; }
.prism-lbl  { animation: prismIn 0.8s ease 2.0s both; }
.sig-dot    { animation: prismIn 0.5s ease 0.5s both; }
.sig-label  { animation: labelIn 0.5s ease 0.7s both; }

.s-glow-0 { stroke-dasharray:900; animation: specGlowReveal 1.1s ease 2.3s both; }
.s-core-0 { stroke-dasharray:900; animation: specReveal     1.1s ease 2.3s both; }
.s-lbl-0  { animation: labelIn 0.5s ease 3.3s both; }

.s-glow-1 { stroke-dasharray:900; animation: specGlowReveal 1.1s ease 2.55s both; }
.s-core-1 { stroke-dasharray:900; animation: specReveal     1.1s ease 2.55s both; }
.s-lbl-1  { animation: labelIn 0.5s ease 3.5s both; }

.s-glow-2 { stroke-dasharray:900; animation: specGlowReveal 1.1s ease 2.8s both; }
.s-core-2 { stroke-dasharray:900; animation: specReveal     1.1s ease 2.8s both; }
.s-lbl-2  { animation: labelIn 0.5s ease 3.7s both; }

.s-glow-3 { stroke-dasharray:900; animation: specGlowReveal 1.1s ease 3.05s both; }
.s-core-3 { stroke-dasharray:900; animation: specReveal     1.1s ease 3.05s both; }
.s-lbl-3  { animation: labelIn 0.5s ease 3.9s both; }

.s-glow-4 { stroke-dasharray:900; animation: specGlowReveal 1.1s ease 3.3s both; }
.s-core-4 { stroke-dasharray:900; animation: specReveal     1.1s ease 3.3s both; }
.s-lbl-4  { animation: labelIn 0.5s ease 4.1s both; }

/* Hover */
.spectrum-group { cursor: default; }
.spectrum-group .s-core,
.spectrum-group .s-glow,
.spectrum-group .s-lbl { transition: opacity 0.3s ease; }

.prism-svg.dimmed .spectrum-group .s-core,
.prism-svg.dimmed .spectrum-group .s-glow,
.prism-svg.dimmed .spectrum-group .s-lbl { opacity: 0.06 !important; }

.prism-svg.dimmed .spectrum-group.active .s-core { opacity: 1 !important; }
.prism-svg.dimmed .spectrum-group.active .s-glow { opacity: 0.40 !important; }
.prism-svg.dimmed .spectrum-group.active .s-lbl  { opacity: 1 !important; }

@media print {
  #star-canvas, .nebula, .vignette { display: none !important; }
  body { background: #06080f !important; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; }
}
</style>
</head>

<script>
/* Star field */
const canvas = document.getElementById('star-canvas');
const ctx = canvas.getContext('2d');
let stars = [];
function mkStars(n) {
  stars = Array.from({length:n}, () => ({
    x: Math.random(), y: Math.random(),
    r: Math.random()*1.2+0.15,
    o: Math.random()*0.5+0.05
  }));
}
function drawStars() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  stars.forEach(s => {
    ctx.beginPath();
    ctx.arc(s.x*canvas.width, s.y*canvas.height, s.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${s.o})`;
    ctx.fill();
  });
}
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  drawStars();
}
mkStars(260);
resize();
window.addEventListener('resize', resize);

/* Spectrum hover */
const svg = document.getElementById('prismSvg');
const groups = [...svg.querySelectorAll('.spectrum-group')];
groups.forEach(grp => {
  grp.addEventListener('mouseenter', () => {
    svg.classList.add('dimmed');
    grp.classList.add('active');
  });
  grp.addEventListener('mouseleave', () => {
    svg.classList.remove('dimmed');
    grp.classList.remove('active');
  });
});

/* GleanBridge */
try {
  window.GleanBridge.postMessage({actionId:'export-pdf',type:'glean-add-menu',metadata:{label:'Export as PDF',icon:'export'}});
  window.GleanBridge.onMessage('action', d => { if(d.actionId==='export-pdf') window.print(); });
} catch(e) {}
